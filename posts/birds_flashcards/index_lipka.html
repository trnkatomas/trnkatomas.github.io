<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hlasy ptáků – kvíz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f0f4f0;
      color: #1a2a1a;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4a7c4a;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    #card {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    #progress-bar-wrap {
      background: #e8f0e8;
      border-radius: 999px;
      height: 6px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #4a7c4a;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    #progress-text {
      text-align: center;
      font-size: 0.85rem;
      color: #7a9a7a;
    }

    #play-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    #play-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: #4a7c4a;
      color: white;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 4px 12px rgba(74,124,74,0.35);
    }
    #play-btn:hover { background: #3a6a3a; }
    #play-btn:active { transform: scale(0.95); }
    #play-btn.playing { background: #2a8a5a; }

    #play-label {
      font-size: 0.8rem;
      color: #7a9a7a;
    }

    #options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .opt-btn {
      padding: 0.85rem 0.5rem;
      border-radius: 0.75rem;
      border: 2px solid #d8e8d8;
      background: #f8fbf8;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      line-height: 1.3;
      text-align: center;
    }
    .opt-btn:hover:not(:disabled) {
      border-color: #4a7c4a;
      background: #eef5ee;
    }
    .opt-btn:active:not(:disabled) { transform: scale(0.97); }
    .opt-btn.correct  { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; }
    .opt-btn.wrong    { border-color: #c62828; background: #ffebee; color: #b71c1c; }
    .opt-btn.reveal   { border-color: #2e7d32; background: #e8f5e9; color: #1b5e20; }
    .opt-btn:disabled { cursor: default; }

    #feedback {
      text-align: center;
      font-size: 1rem;
      font-weight: 600;
      min-height: 1.4em;
    }
    #feedback.correct { color: #2e7d32; }
    #feedback.wrong   { color: #c62828; }

    #next-btn {
      padding: 0.85rem;
      border-radius: 0.75rem;
      border: none;
      background: #4a7c4a;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: none;
    }
    #next-btn:hover { background: #3a6a3a; }

    #score-board {
      text-align: center;
      font-size: 0.85rem;
      color: #7a9a7a;
    }

    /* finished screen */
    #finished {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
    }
    #finished h2 { font-size: 1.5rem; color: #4a7c4a; }
    #finished p  { color: #5a7a5a; }
    #restart-btn {
      padding: 0.85rem 2rem;
      border-radius: 0.75rem;
      border: none;
      background: #4a7c4a;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    #restart-btn:hover { background: #3a6a3a; }

    #size-selector {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .size-btn {
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      border: 2px solid #4a7c4a;
      background: transparent;
      color: #4a7c4a;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .size-btn:hover, .size-btn.active {
      background: #4a7c4a;
      color: white;
    }

    #attribution {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #9aaa9a;
      text-align: center;
    }
    #attribution a { color: #4a7c4a; }

    /* mode switch (Test / Trénink) */
    #mode-selector {
      display: flex;
      gap: 0.25rem;
      padding: 0.25rem;
      background: #e3ede3;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }
    .mode-btn {
      padding: 0.4rem 1.3rem;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: #4a7c4a;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn.active { background: #4a7c4a; color: white; }

    body.mode-train .quiz-only { display: none !important; }
    body:not(.mode-train) .train-only { display: none !important; }

    /* time axis: shows position in the recording, deliberately without any time labels */
    #timeline {
      width: 100%;
      max-width: 320px;
      padding: 0 8px;
      cursor: pointer;
      touch-action: none;
      outline: none;
    }
    #timeline.disabled { opacity: 0.35; pointer-events: none; }
    #tl-track { position: relative; height: 28px; }
    #tl-track::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 50%;
      height: 6px; margin-top: -3px;
      border-radius: 999px;
      background: #e8f0e8;
    }
    #tl-fill {
      position: absolute;
      left: 0; top: 50%;
      width: 0; height: 6px; margin-top: -3px;
      border-radius: 999px;
      background: #4a7c4a;
    }
    #tl-thumb {
      position: absolute;
      left: 0; top: 50%;
      width: 16px; height: 16px; margin: -8px 0 0 -8px;
      border-radius: 50%;
      background: white;
      border: 3px solid #4a7c4a;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    #timeline:focus-visible #tl-thumb { outline: 2px solid #2a8a5a; outline-offset: 2px; }

    #play-btn:disabled {
      background: #b8ccb8;
      box-shadow: none;
      cursor: default;
    }

    /* train mode */
    #train-title {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      color: #2a4a2a;
      min-height: 1.6em;
    }

    /* bird picker: typeahead input + dropdown */
    #bird-picker { position: relative; }
    #bird-picker::after {
      content: "▾";
      position: absolute;
      right: 1rem;
      top: 0.65rem;
      font-size: 1.25rem;
      color: #7a9a7a;
      pointer-events: none;
    }
    #bird-input {
      width: 100%;
      padding: 0.75rem 2.4rem 0.75rem 1rem;
      border-radius: 0.75rem;
      border: 2px solid #d8e8d8;
      background: #f8fbf8;
      font: inherit;
      font-size: 1rem;
      color: inherit;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }
    #bird-input:focus { border-color: #4a7c4a; background: white; }
    #bird-menu {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      max-height: 240px;
      overflow-y: auto;
      list-style: none;
      padding: 0.25rem;
      background: white;
      border: 2px solid #4a7c4a;
      border-radius: 0.75rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    #bird-menu[hidden] { display: none; }
    #bird-menu li {
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.95rem;
      cursor: pointer;
    }
    #bird-menu li.hi { background: #e3ede3; }
    #bird-menu li.sel { font-weight: 700; color: #2a8a5a; }
    #bird-menu li.empty { color: #7a9a7a; cursor: default; }
  </style>
</head>
<body>
  <h1>Hlasy ptáků</h1>

  <div id="mode-selector">
    <button class="mode-btn active" data-mode="quiz">Test</button>
    <button class="mode-btn" data-mode="train">Trénink</button>
  </div>

  <div id="size-selector" class="quiz-only">
    <button class="size-btn active" data-size="0">Vše</button>
    <button class="size-btn" data-size="5">5</button>
    <button class="size-btn" data-size="10">10</button>
    <button class="size-btn" data-size="20">20</button>
  </div>

  <div id="card">
    <div id="bird-picker" class="train-only">
      <input id="bird-input" type="text" placeholder="Začni psát nebo vyber ze seznamu…"
             autocomplete="off" autocapitalize="off" spellcheck="false"
             role="combobox" aria-expanded="false" aria-controls="bird-menu" aria-autocomplete="list">
      <ul id="bird-menu" role="listbox" hidden></ul>
    </div>

    <div id="train-title" class="train-only">Vyber ptáka ze seznamu</div>

    <div id="progress-bar-wrap" class="quiz-only"><div id="progress-bar" style="width:0%"></div></div>
    <div id="progress-text" class="quiz-only">Karta 1 / 38</div>

    <div id="play-area">
      <button id="play-btn" title="Přehrát hlas">▶</button>
      <div id="timeline" class="disabled" role="slider" tabindex="0"
           aria-label="Pozice v nahrávce" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="tl-track"><div id="tl-fill"></div><div id="tl-thumb"></div></div>
      </div>
      <span id="play-label">Přehraj hlas a uhádni ptáka</span>
    </div>

    <div id="options" class="quiz-only"></div>

    <div id="feedback" class="quiz-only"></div>
    <button id="next-btn" class="quiz-only">Další →</button>
    <div id="score-board" class="quiz-only">Skóre: 0 / 0</div>

    <div id="finished" class="quiz-only">
      <h2>🎉 Hotovo!</h2>
      <p id="final-score"></p>
      <button id="restart-btn">Hrát znovu</button>
    </div>
  </div>

  <div id="attribution">
    Nahrávky hlasů ptáků: <a href="https://www.lipka.cz" target="_blank" rel="noopener">lipka.cz</a>
  </div>

  <audio id="audio"></audio>

  <script>
    const CHOICES = 4;

    const birds = [
      { name: "žluva hajní",          audio_url: "https://www.lipka.cz/audio/zluvah.mp3" },
      { name: "žluna zelená",         audio_url: "https://www.lipka.cz/audio/zlunaz.mp3" },
      { name: "zvonohlík zahradní",   audio_url: "https://www.lipka.cz/audio/zvonohlikz.mp3" },
      { name: "zvonek zelený",        audio_url: "https://www.lipka.cz/audio/zvonekz.mp3" },
      { name: "vrabec domácí",        audio_url: "https://www.lipka.cz/audio/vrabecd.mp3" },
      { name: "šoupálek krátkoprstý", audio_url: "https://www.lipka.cz/audio/soupalekk.mp3" },
      { name: "sýkora modřinka",      audio_url: "https://www.lipka.cz/audio/sykoram.mp3" },
      { name: "špaček obecný",        audio_url: "https://www.lipka.cz/audio/spaceko.mp3" },
      { name: "sýkora koňadra",       audio_url: "https://www.lipka.cz/audio/sykorak.mp3" },
      { name: "stehlík obecný",       audio_url: "https://www.lipka.cz/audio/stehliko.mp3" },
      { name: "střízlík obecný",      audio_url: "https://www.lipka.cz/audio/strizliko.mp3" },
      { name: "sojka obecná",         audio_url: "https://www.lipka.cz/audio/sojkao.mp3" },
      { name: "strakapoud velký",     audio_url: "https://www.lipka.cz/audio/strakapoudv.mp3" },
      { name: "sýkora babka",         audio_url: "https://www.lipka.cz/audio/sykorab.mp3" },
      { name: "puštík obecný",        audio_url: "https://www.lipka.cz/audio/pustiko.mp3" },
      { name: "rehek domácí",         audio_url: "https://www.lipka.cz/audio/rehekd.mp3" },
      { name: "pěnkava obecná",       audio_url: "https://www.lipka.cz/audio/penkavao.mp3" },
      { name: "pěnice černohlavá",    audio_url: "https://www.lipka.cz/audio/penicec.mp3" },
      { name: "kukačka obecná",       audio_url: "https://www.lipka.cz/audio/kukackao.mp3" },
      { name: "kos černý",            audio_url: "https://www.lipka.cz/audio/kosc.mp3" },
      { name: "lejsek šedý",          audio_url: "https://www.lipka.cz/audio/lejseks.mp3" },
      { name: "krutihlav obecný",     audio_url: "https://www.lipka.cz/audio/krutihlavo.mp3" },
      { name: "kachna indický běžec", audio_url: "https://www.lipka.cz/audio/indickyb.mp3" },
      { name: "hrdlička zahradní",    audio_url: "https://www.lipka.cz/audio/hrdlickaz.mp3" },
      { name: "jiřička obecná",       audio_url: "https://www.lipka.cz/audio/jirickao.mp3" },
      { name: "kachna divoká",        audio_url: "https://www.lipka.cz/audio/kachnadiv.mp3" },
      { name: "hýl obecný",           audio_url: "https://www.lipka.cz/audio/hylo.mp3" },
      { name: "drozd kvíčala",        audio_url: "https://www.lipka.cz/audio/drozdk.mp3" },
      { name: "drozd zpěvný",         audio_url: "https://www.lipka.cz/audio/drozdz.mp3" },
      { name: "dlask tlustozobý",     audio_url: "https://www.lipka.cz/audio/dlaskt.mp3" },
      { name: "červenka obecná",      audio_url: "https://www.lipka.cz/audio/cervenkao.mp3" },
      { name: "brkoslav severní",     audio_url: "https://www.lipka.cz/audio/brkoslavs.mp3" },
      { name: "budníček menší",       audio_url: "https://www.lipka.cz/audio/budnicekm.mp3" },
      { name: "brhlík lesní",         audio_url: "https://www.lipka.cz/audio/brhlikl.mp3" },
      { name: "vlaštovka obecná",     audio_url: "https://www.lipka.cz/audio/vlastovkao.mp3" },
      { name: "rehek zahradní",       audio_url: "https://www.lipka.cz/audio/rehekz.mp3" },
      { name: "mlynařík dlouhoocasý", audio_url: "https://www.lipka.cz/audio/mlynarikd.mp3" },
      { name: "holub hřivnáč",        audio_url: "https://www.lipka.cz/audio/holubh.mp3" },
    ];

    let order = [];
    let current = 0;
    let correct = 0;
    let answered = false;
    let gameSize = 0; // 0 = all

    function audioSrc(bird) { return bird.audio_url; }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function startQuiz() {
      const count = gameSize || birds.length;
      order = shuffle([...Array(birds.length).keys()]).slice(0, count);
      current = 0;
      correct = 0;
      answered = false;
      document.getElementById("finished").style.display = "none";
      document.getElementById("play-area").style.display = "flex";
      document.getElementById("options").style.display = "grid";
      document.getElementById("score-board").style.display = "";
      showCard();
    }

    function showCard() {
      answered = false;
      const idx = order[current];
      const bird = birds[idx];

      // progress
      const pct = (current / order.length) * 100;
      document.getElementById("progress-bar").style.width = pct + "%";
      document.getElementById("progress-text").textContent =
        `Karta ${current + 1} / ${order.length}`;

      // audio
      loadAudio(audioSrc(bird));
      playBtn.disabled = false;

      // options: 1 correct + (CHOICES-1) random wrong
      const others = shuffle(birds
        .map((b, i) => i)
        .filter(i => i !== idx)
      ).slice(0, CHOICES - 1);
      const choices = shuffle([idx, ...others]);

      const optDiv = document.getElementById("options");
      optDiv.innerHTML = "";
      choices.forEach(i => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.textContent = birds[i].name;
        btn.dataset.idx = i;
        btn.addEventListener("click", () => handleAnswer(btn, idx));
        optDiv.appendChild(btn);
      });

      // reset feedback & next
      document.getElementById("feedback").textContent = "";
      document.getElementById("feedback").className = "";
      document.getElementById("next-btn").style.display = "none";
      updateScore();

      // autoplay
      player.play().catch(() => {});
    }

    function handleAnswer(btn, correctIdx) {
      if (answered) return;
      answered = true;

      const chosen = parseInt(btn.dataset.idx);
      const isCorrect = chosen === correctIdx;
      if (isCorrect) correct++;

      // colour all buttons
      document.querySelectorAll(".opt-btn").forEach(b => {
        b.disabled = true;
        if (parseInt(b.dataset.idx) === correctIdx) b.classList.add(isCorrect ? "correct" : "reveal");
        else if (b === btn && !isCorrect)           b.classList.add("wrong");
      });

      const fb = document.getElementById("feedback");
      if (isCorrect) {
        fb.textContent = "Správně! ✓";
        fb.className = "correct";
      } else {
        fb.textContent = `Špatně – byl to ${birds[correctIdx].name}`;
        fb.className = "wrong";
      }

      updateScore();
      document.getElementById("next-btn").style.display = "block";
    }

    function updateScore() {
      document.getElementById("score-board").textContent =
        `Skóre: ${correct} / ${current + (answered ? 1 : 0)}`;
    }

    // ---------- player + time axis ----------
    const player = document.getElementById("audio");
    const playBtn = document.getElementById("play-btn");
    const timeline = document.getElementById("timeline");
    const tlTrack = document.getElementById("tl-track");
    const tlFill = document.getElementById("tl-fill");
    const tlThumb = document.getElementById("tl-thumb");
    let rafId = null;

    function hasDuration() {
      return isFinite(player.duration) && player.duration > 0;
    }

    function renderTimeline() {
      const f = hasDuration() ? Math.min(player.currentTime / player.duration, 1) : 0;
      const pct = f * 100;
      tlFill.style.width = pct + "%";
      tlThumb.style.left = pct + "%";
      timeline.setAttribute("aria-valuenow", Math.round(pct));
      timeline.classList.toggle("disabled", !hasDuration());
    }

    function setPlayingUI(playing) {
      playBtn.textContent = playing ? "⏸" : "▶";
      playBtn.classList.toggle("playing", playing);
    }

    function loadAudio(src) {
      player.src = src;
      player.load();
      setPlayingUI(false);
      renderTimeline();
    }

    function tick() {
      renderTimeline();
      rafId = requestAnimationFrame(tick);
    }
    function stopTick() {
      cancelAnimationFrame(rafId);
      rafId = null;
      renderTimeline();
    }

    player.addEventListener("play", () => { setPlayingUI(true); if (rafId === null) tick(); });
    player.addEventListener("pause", () => { setPlayingUI(false); stopTick(); });
    player.addEventListener("ended", () => { setPlayingUI(false); stopTick(); });
    ["loadedmetadata", "durationchange", "seeked", "timeupdate"].forEach(ev =>
      player.addEventListener(ev, renderTimeline));

    // play / pause (pausing keeps the position; the axis shows where we are)
    playBtn.addEventListener("click", () => {
      if (!player.getAttribute("src")) return;
      if (player.paused) player.play().catch(() => {});
      else player.pause();
    });

    // seek by clicking / dragging the axis, or with arrow keys
    let scrubbing = false;
    function seekFromPointer(e) {
      if (!hasDuration()) return;
      const r = tlTrack.getBoundingClientRect();
      const f = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1);
      player.currentTime = f * player.duration;
      renderTimeline();
    }
    timeline.addEventListener("pointerdown", e => {
      scrubbing = true;
      timeline.setPointerCapture(e.pointerId);
      seekFromPointer(e);
    });
    timeline.addEventListener("pointermove", e => { if (scrubbing) seekFromPointer(e); });
    ["pointerup", "pointercancel"].forEach(ev =>
      timeline.addEventListener(ev, () => { scrubbing = false; }));
    timeline.addEventListener("keydown", e => {
      if (!hasDuration()) return;
      const step = player.duration * 0.05;
      if (e.key === "ArrowRight") player.currentTime = Math.min(player.duration, player.currentTime + step);
      else if (e.key === "ArrowLeft") player.currentTime = Math.max(0, player.currentTime - step);
      else return;
      e.preventDefault();
      renderTimeline();
    });

    // ---------- modes: quiz (Test) / train (Trénink) ----------
    let mode = "quiz";
    let trainIdx = null;

    // bird picker: typeahead input + dropdown (accent-insensitive, so "zluna" finds "žluna")
    const birdInput = document.getElementById("bird-input");
    const birdMenu = document.getElementById("bird-menu");
    let sortedIdx = [];
    let menuItems = [];
    let hi = -1;

    function norm(s) {
      return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function buildBirdList() {
      sortedIdx = birds.map((b, i) => i)
        .sort((a, b) => birds[a].name.localeCompare(birds[b].name, "cs"));
    }

    function setHi(pos, scroll) {
      hi = pos;
      [...birdMenu.children].forEach((li, p) => li.classList.toggle("hi", p === pos));
      if (scroll && birdMenu.children[pos]) birdMenu.children[pos].scrollIntoView({ block: "nearest" });
    }

    function renderMenu() {
      const q = norm(birdInput.value.trim());
      menuItems = sortedIdx.filter(i => norm(birds[i].name).includes(q));
      if (q) {
        // names starting with the query first (sort is stable, so alphabetical order is kept)
        menuItems.sort((a, b) =>
          norm(birds[a].name).startsWith(q) === norm(birds[b].name).startsWith(q) ? 0
            : norm(birds[a].name).startsWith(q) ? -1 : 1);
      }
      birdMenu.innerHTML = "";
      menuItems.forEach((i, pos) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        li.textContent = birds[i].name;
        li.dataset.pos = pos;
        if (i === trainIdx) li.classList.add("sel");
        birdMenu.appendChild(li);
      });
      if (!menuItems.length) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Nic nenalezeno";
        birdMenu.appendChild(li);
      }
      // typing: highlight best match; plain dropdown: highlight the current bird
      setHi(q ? (menuItems.length ? 0 : -1) : menuItems.indexOf(trainIdx), true);
    }

    function openMenu() {
      renderMenu();
      birdMenu.hidden = false;
      birdInput.setAttribute("aria-expanded", "true");
    }

    function closeMenu() {
      birdMenu.hidden = true;
      birdInput.setAttribute("aria-expanded", "false");
    }

    function chooseBird(idx) {
      selectBird(idx, true);
      birdInput.value = "";
      closeMenu();
      birdInput.blur();
    }

    birdInput.addEventListener("focus", openMenu);
    birdInput.addEventListener("click", () => { if (birdMenu.hidden) openMenu(); });
    birdInput.addEventListener("input", openMenu);
    birdInput.addEventListener("blur", () => { closeMenu(); birdInput.value = ""; });
    birdInput.addEventListener("keydown", e => {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        if (birdMenu.hidden) { openMenu(); return; }
        if (!menuItems.length) return;
        const step = e.key === "ArrowDown" ? 1 : -1;
        setHi((hi + step + menuItems.length) % menuItems.length, true);
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (!birdMenu.hidden && hi >= 0 && menuItems[hi] !== undefined) chooseBird(menuItems[hi]);
      } else if (e.key === "Escape") {
        closeMenu();
      }
    });
    // keep focus in the input while using the menu (also while dragging its scrollbar)
    birdMenu.addEventListener("mousedown", e => e.preventDefault());
    birdMenu.addEventListener("click", e => {
      const li = e.target.closest("li[data-pos]");
      if (li) chooseBird(menuItems[Number(li.dataset.pos)]);
    });
    birdMenu.addEventListener("mousemove", e => {
      const li = e.target.closest("li[data-pos]");
      if (li && Number(li.dataset.pos) !== hi) setHi(Number(li.dataset.pos), false);
    });

    function selectBird(idx, autoplay) {
      const sameBird = idx !== null && idx === trainIdx;
      trainIdx = idx;
      const title = document.getElementById("train-title");

      if (idx === null) {
        title.textContent = "Vyber ptáka ze seznamu";
        playBtn.disabled = true;
        player.removeAttribute("src");
        player.load();
        setPlayingUI(false);
        renderTimeline();
        return;
      }

      title.textContent = birds[idx].name;
      playBtn.disabled = false;
      if (sameBird && player.getAttribute("src")) {
        player.currentTime = 0;
      } else {
        loadAudio(audioSrc(birds[idx]));
      }
      if (autoplay) player.play().catch(() => {});
    }

    function setMode(m) {
      mode = m;
      player.pause();
      document.body.classList.toggle("mode-train", m === "train");
      document.querySelectorAll(".mode-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.mode === m));

      if (m === "train") {
        document.getElementById("play-area").style.display = "flex";
        document.getElementById("play-label").textContent = "Přehraj hlas";
        selectBird(trainIdx, false);
      } else {
        document.getElementById("play-label").textContent = "Přehraj hlas a uhádni ptáka";
        playBtn.disabled = false;
        startQuiz();
      }
    }

    document.querySelectorAll(".mode-btn").forEach(btn =>
      btn.addEventListener("click", () => { if (btn.dataset.mode !== mode) setMode(btn.dataset.mode); }));

    // next button
    document.getElementById("next-btn").addEventListener("click", () => {
      document.getElementById("audio").pause();
      current++;
      if (current >= order.length) {
        showFinished();
      } else {
        showCard();
      }
    });

    // restart
    document.getElementById("restart-btn").addEventListener("click", startQuiz);

    // size selector
    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        gameSize = parseInt(btn.dataset.size);
        startQuiz();
      });
    });

    function showFinished() {
      document.getElementById("play-area").style.display = "none";
      document.getElementById("options").style.display = "none";
      document.getElementById("feedback").textContent = "";
      document.getElementById("next-btn").style.display = "none";
      document.getElementById("score-board").style.display = "none";
      document.getElementById("progress-bar").style.width = "100%";
      document.getElementById("progress-text").textContent = "Hotovo!";

      const pct = Math.round((correct / order.length) * 100);
      document.getElementById("final-score").textContent =
        `${correct} z ${order.length} správně (${pct} %)`;
      document.getElementById("finished").style.display = "flex";
    }

    buildBirdList();
    startQuiz();
  </script>
</body>
</html>
